<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ascent</title>
  <meta name="description" content="Ascent — coming soon.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: #000;
      color: #fff;
      font-family: "Sora", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* faint glow behind the wordmark */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 50% 35% at 50% 50%, rgba(255, 255, 255, 0.07), transparent 70%);
      pointer-events: none;
    }

    main { position: relative; padding: 0 1.5rem; }

    h1 {
      font-weight: 200;
      font-size: clamp(3rem, 12vw, 9rem);
      letter-spacing: 0.18em;
      text-indent: 0.18em; /* offsets trailing letter-spacing so it centers optically */
      text-transform: none;
      line-height: 1;
      opacity: 0;
      animation: rise 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s forwards;
    }

    p {
      margin-top: 2rem;
      font-weight: 300;
      font-size: clamp(0.7rem, 1.4vw, 0.85rem);
      letter-spacing: 0.5em;
      text-indent: 0.5em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      opacity: 0;
      animation: rise 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) 0.9s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      h1, p { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Ascent</h1>
    <p>Coming soon</p>
  </main>
</body>
</html>
